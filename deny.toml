[graph]
all-features = false

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
deny = [
    { name = "ureq" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "curl" },
    { name = "minreq" },
    { name = "reqwest-middleware" },
    { name = "http-req" },
    { name = "nyquest" },
    { name = "awc" },
    { name = "hyper-tls" },
    { name = "native-tls" },
    { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
