[package]
name = "hackerone-mcp"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "HackerOne MCP server with local drafts and opt-in report submission"

[[bin]]
name = "hackerone-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
schemars = "1"
toml = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
